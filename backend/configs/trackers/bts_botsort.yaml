# BoT-SORT with camera-motion compensation (sparse optical flow) for handheld phone footage. No ReID model
# (with_reid: false); appearance re-linking is done by the equipment identity layer instead.
tracker_type: botsort
track_high_thresh: 0.30
track_low_thresh: 0.10
new_track_thresh: 0.35
track_buffer: 90
match_thresh: 0.85
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
